<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betopia Assignment</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/432646834d.js" crossorigin="anonymous"></script>
</head>
<body class="oswald text-background">

    <!-- hero section  -->

    <section style="background: linear-gradient(180deg, #ffffff 0%, rgba(255,165,0,0.1) 100%)" class="h-screen w-full relative">
        <nav class="max-w-360 mx-auto flex items-center justify-between
          py-6 md:px-10 px-2 lg:px-20 xl:px-30 h-22 border">

            <!-- main logo -->
            <div class="w-[32px] cursor-pointer aspect-square">
                <img class="w-full h-full" src="/images/Logo.png" alt="main-logo"/>
            </div>
            <div class="flex items-center justify-center text-[16px] gap-3 sm:gap-10 md:gap-20 lg:gap-30 font-medium">
                <div class="sm:flex hidden gap-3 sm:gap-10 md:gap-20 lg:gap-30">
                    <a class="text-secondary" href="">Services</a>
                    <a href="">About</a>
                    <a href="">Contact</a>
                </div>
                <div>
                    <button class="tracking-[-2%] w-42.25 h-10 bg-secondary text-white rounded-[40px] font-[14px] border-[0px_3px_3px_0px] border-background cursor-pointer ">Book a Free Consultation</button>
                </div>

                <!-- humberger menu goes here  -->
                <div id="hamburger" class=" sm:hidden text-3xl w-fit ">
                    <div id="open" class="">
                        <i  class="fa-solid fa-bars"></i>
                    </div>
                    <div id="close" class="hidden text-4xl">
                        <i  class="fa-solid  fa-xmark hidden"></i>
                    </div>
                </div>
            </div>
        </nav>
        <div class="absolute h-[calc(100vh-88px)] bg-background text-white text-5xl  z-999 w-full bottom-0 flex items-center justify-center ">
            <div class="flex text-center flex-col gap-y-12">
                    <a class="" href="">Services</a>
                    <a href="">About</a>
                    <a href="">Contact</a>
                </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
