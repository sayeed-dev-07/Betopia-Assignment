<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betopia Assignment</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/432646834d.js" crossorigin="anonymous"></script>
</head>
<body class="oswald text-background">

    <!-- hero section  -->


    
    <section style="background: linear-gradient(180deg, #ffffff 0%, rgba(255,165,0,0.1) 100%)" class="h-screen overflow-hidden w-full relative ">
        <nav class="max-w-360 mx-auto flex items-center justify-between
          py-6 md:px-10 px-2 lg:px-20 xl:px-30 h-22 ">

            <!-- main logo -->
            <div class="sm:w-[32px] w-[40px] cursor-pointer aspect-square">
                <img class="w-full h-full" src="/images/Logo.png" alt="main-logo"/>
            </div>
            <div class="flex items-center justify-center text-[16px] gap-3 sm:gap-10 md:gap-20 lg:gap-30 font-medium">
                <div class="sm:flex hidden gap-3 sm:gap-10 md:gap-20 lg:gap-30">
                    <a class="text-secondary" href="">Services</a>
                    <a href="">About</a>
                    <a href="">Contact</a>
                </div>
                <div>
                    <button class="button w-42.25 h-10">Book a Free Consultation</button>
                </div>

                <!-- humberger menu goes here  -->
                <div id="hamburger" class=" sm:hidden text-3xl w-fit ">
                    <div id="open" class="">
                        <i  class="fa-solid fa-bars"></i>
                    </div>
                    <div id="close" class="hidden text-4xl">
                        <i  class="fa-solid  fa-xmark hidden"></i>
                    </div>
                </div>
            </div>
        </nav>
        <div id="navItems" class="absolute left-0 h-[calc(100vh-88px)] bg-background text-white text-5xl  z-999 w-full bottom-0 flex items-center justify-center transition-all duration-300 ease-out hamburgerOff ">
            <div id="linkWrapper" class="flex  text-center flex-col gap-y-12">
                    <a class="" href="">Services</a>
                    <a href="">About</a>
                    <a href="">Contact</a>
                </div>
        </div>

        <!-- hero content  -->
         <div class="relative">
            <div class="absolute md:top-[40%] top-[70%] -left-[5%] md:left-1 lg:left-[5%] h-[178px] w-[228px] z-5">
                <img src="/images/incomeContainer.png" alt="heroLeftImg" >
            </div>
            <div class="flex-center text-center h-[calc(100vh-88px)] ">
                <!-- middle part  -->
                <div class="max-w-[820px] h-[286px] relative z-10 flex-col-center gap-y-[32px] px-2 w-full ">
                    <!-- upper text  -->
                    <div class="flex-center">
                        <div class="w-[64px] h-[30px] rounded-[8px] border border-white">
                        <img src="/images/amazonLogo.png" alt="amzonLogo">
                    </div>
                    <p class="text-[16px] tracking-[-2%] font-[400]">
                        Your Full-Service <span class="text-secondary">
                            Amazon Partner
                        </span>
                    </p>
                    </div>
                    <!-- middle text  -->
                    <div class="lg:text-[60px] text-4xl sm:text-[45px] xl:text-[72px] -tracking-[2%] font-[600] leading-tight lg:leading-[80px]">
                        <p>Turn Your Amazon Struggles into Success—Save Time, <span class="text-secondary">
                            Maximize Profits!
                        </span></p>
                    </div>
                    <div>
                        <button class="button w-[211px] h-[50px]">Book a Free Consultation</button>
                    </div>
                </div>

            </div>
            <div class="absolute w-[236px] h-[84px] top-[5%] md:top-[30%] lg:right-[5%] -right-[5%] md:right-1 z-5">
                <img src="/images/reviewContainer.png" alt="heroLeftImg" >
            </div>
         </div>
    </section>
    



    <script src="script.js"></script>
</body>
</html>
